MEMORY {
    # Zero page. ld65 hands out the ZEROPAGE segment from here.
    # ($0100-$01FF is the CPU stack, in emulation mode.)
    ZP:  start = $0000, size = $0100, type = rw;
    # RAM for the BSS segment (everything declared with .res outside zero page).
    # $0200-$04FF is deliberately left alone: thru_defs.inc pins ACIA_BUF at
    # $0400 by hand, which the linker can't see. Once ACIA_BUF is allocated
    # with .res like the rest, this can start at $0200 again.
    # Assumes RAM runs up to $3FFF (the VIA decodes at $4000).
    RAM: start = $0500, size = $3B00, type = rw;    
    ROM: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $EA;
}

SEGMENTS {
    ZEROPAGE:   load = ZP,  type = zp;
    BSS:        load = RAM, type = bss;
    CODE:       load = ROM, type = ro;
    RODATA:     load = ROM, type = ro;
    KEYMAP:     load = ROM, type = ro, start = $9C00;
    #WOZMON:     load = ROM, type = ro, start = $9EF0;
    VECTORS:    load = ROM, type = ro, start = $9FFA;
}